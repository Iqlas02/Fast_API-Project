apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fastapi.fullname" . }}-test-connection"
  labels:
    helm.sh/chart: {{ include "fastapi.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "fastapi.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
